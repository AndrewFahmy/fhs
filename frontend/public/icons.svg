        <path d="M1 1.5L6 6.5L11 1.5" />
    </symbol>

    <symbol id="sun" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round">
        <circle cx="18" cy="18" r="6" />
        <path
            d="M18 4V8M18 28V32M4 18H8M28 18H32M8.2 8.2L11 11M25 25L27.8 27.8M27.8 8.2L25 11M11 25L8.2 27.8" />
    </symbol>

    <symbol id="moon" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.5"
