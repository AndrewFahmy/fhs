        <path d="M6 6L18 18M18 6L6 18" />
    </symbol>

    <symbol id="alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4L21 20H3L12 4Z" />
        <path d="M12 10V14M12 17.2V17.3" />
