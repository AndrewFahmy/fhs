<svg xmlns="http://www.w3.org/2000/svg">
    <symbol id="logo" viewBox="0 0 27 27" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <path d="M7 8H20M7 14H17M7 20H14" />
    </symbol>

    <symbol id="menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <path d="M4 7H20M4 12H20M4 17H20" />
    </symbol>

    <symbol id="chevron-down" viewBox="0 0 12 8" fill="none" stroke="currentColor"
